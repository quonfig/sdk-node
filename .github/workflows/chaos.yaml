name: Chaos

# Runs the cross-SDK chaos harness (toxiproxy + scenarios from
# integration-test-data/chaos) against sdk-node. Boots api-delivery in
# fixture mode and drives every scenario in scenarios/*.yaml through it.
#
# Two modes:
#   - smoke   : skips 11-null-hypothesis (the 30-minute idle scenario);
#               runs on every push to main (~16 min wall clock). Not run
#               on PRs: too slow to gate every PR, so failover-chaos.yaml
#               (~2 min) is the PR-time chaos gate.
#   - full    : every scenario; runs weekly (Mon 09:00 UTC), on workflow_dispatch + via the release
#               workflow as a publish gate (~48 min).
#
# Wired via workflow_call so release.yaml can `needs:` it.

on:
  push:
    branches: [main]
  schedule:
    # Weekly full suite (incl. 11-null-hypothesis) so the 30-minute
    # scenario runs even in weeks without a release.
    - cron: "0 9 * * 1"
  workflow_call:
    inputs:
      mode:
        description: "smoke (skip 11) or full"
        required: false
        type: string
        default: smoke
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke (skip 11) or full"
        required: false
        type: choice
        options: [smoke, full]
        default: smoke

jobs:
  chaos:
    name: Chaos (${{ github.event_name == 'schedule' && 'full' || inputs.mode || 'smoke' }})
    runs-on: ubuntu-latest
    # Smoke ~16 min; full ~48 min. Cap at 75 min to allow for warmup +
    # docker pull. Run will fail fast inside the scenario via its own
    # wall_clock_seconds, so this only kicks in if something hangs.
    timeout-minutes: 75
    # The `secrets` context cannot be referenced in step `if:`
    # conditions, so surface the token's presence as a job-level env
    # var. Dependabot-triggered runs have no access to repo Actions
    # secrets, so HAS_REPO_TOKEN is 'false' for them and the chaos
    # harness steps below are skipped rather than hard failing. The job
    # itself still runs, so its name renders to `Chaos (smoke)` and the
    # required check is satisfied (a job-level `if:` skip reports the
    # raw, unrendered name and blocks the PR forever).
    env:
      HAS_REPO_TOKEN: ${{ secrets.QUONFIG_REPO_TOKEN != '' }}
    steps:
      - name: Checkout sdk-node
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: sdk-node

      - name: Checkout integration-test-data
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: quonfig/integration-test-data
          path: integration-test-data
          # Pinned so the chaos gate moves only when the scenarios are
          # deliberately rev'd. Bumped with the chaos harness itself
          # (after_ms + strict expectation keys, qfg-goi1.10.33), so it
          # can run ahead of the unit-test pin in test.yaml.
          ref: v2026.10.16.2

      - name: Checkout api-delivery
        if: env.HAS_REPO_TOKEN == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # api-delivery is private; the default GITHUB_TOKEN cannot
          # read it. A PAT or fine-grained token with read access to
          # quonfig/api-delivery must be configured as the repo secret
          # QUONFIG_REPO_TOKEN. Without it this step fails fast and
          # the chaos gate is red — by design, until the secret is
          # provisioned.
          repository: quonfig/api-delivery
          path: api-delivery
          ref: main
          token: ${{ secrets.QUONFIG_REPO_TOKEN }}

      - name: Record api-delivery SHA
        if: env.HAS_REPO_TOKEN == 'true'
        # api-delivery tracks main on purpose so chaos catches api-delivery
        # drift (kept by decision, qfg-goi1.1.2; see qfg-41nh.14).
        # Record exactly which commit this run exercised.
        run: |
          sha="$(git -C api-delivery rev-parse HEAD)"
          echo "api-delivery @ main: $sha"
          echo "api-delivery @ main: \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        if: env.HAS_REPO_TOKEN == 'true'
        with:
          go-version: "1.26"
          cache-dependency-path: api-delivery/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.HAS_REPO_TOKEN == 'true'
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: sdk-node/package-lock.json

      - name: Install sdk-node deps
        if: env.HAS_REPO_TOKEN == 'true'
        working-directory: sdk-node
        run: npm ci

      - name: Verify docker compose available
        if: env.HAS_REPO_TOKEN == 'true'
        run: docker compose version

      - name: Skipped (no api-delivery access token)
        if: env.HAS_REPO_TOKEN != 'true'
        run: |
          echo "QUONFIG_REPO_TOKEN is not available to this run" \
               "(expected for Dependabot PRs)." \
               "Skipping the chaos harness; Test jobs still gate this PR."

      - name: Run chaos harness
        if: env.HAS_REPO_TOKEN == 'true'
        working-directory: sdk-node
        env:
          # Smoke skips 11-null-hypothesis (30 min idle). Full suite
          # (mode=full) runs everything. 'none' is a truthy sentinel
          # matching no scenario number; the earlier `&& '' ||` form
          # collapsed to '11' even on mode=full because '' is falsy in
          # GitHub expressions (qfg-hvlc). The wrapper honors CHAOS_SKIP.
          CHAOS_SKIP:
            ${{ (github.event_name == 'schedule' || inputs.mode == 'full') && 'none' || '11' }}
        run: ./scripts/run-chaos.sh

      - name: Upload chaos logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chaos-logs-${{ github.run_id }}
          path: |
            sdk-node/.chaos-api-delivery
            sdk-node/chaos-*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Post result to Slack
        # Scheduled (weekly full) and hand-dispatched runs report every result
        # to #incoming-webhook via the org secret SLACK_CI_WEBHOOK. PR and push
        # runs never post, and neither does a release workflow calling this one
        # via workflow_call (github.workflow is then the caller's name).
        if:
          always() && github.workflow == 'Chaos' && (github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch')
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_CI_WEBHOOK }}
          STATUS: ${{ job.status }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUITE: chaos (${{ github.event_name == 'schedule' && 'full' || inputs.mode || 'smoke' }})
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "::error::SLACK_CI_WEBHOOK is not available to this run"
            exit 1
          fi
          case "$STATUS" in
            success) icon=":white_check_mark:" ;;
            cancelled) icon=":heavy_minus_sign:" ;;
            *) icon=":rotating_light:" ;;
          esac
          text="${icon} *${GITHUB_REPOSITORY}* ${SUITE} (${GITHUB_EVENT_NAME}): *${STATUS}* <${RUN_URL}|view run>"
          jq -n --arg text "$text" '{text: $text}' |
            curl -sSf -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK"
