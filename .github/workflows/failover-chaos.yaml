name: Failover Chaos

# Runs the failover + canonical-ordering chaos rigs (toxiproxy + the
# scenarios-failover/ and scenarios-ordering/ corpus from
# integration-test-data/chaos) against sdk-node. Mirrors sdk-go's
# failover-chaos.yaml; fires on every push to main + every PR alongside the
# existing Chaos workflow (chaos.yaml, single-upstream suite).
#
# Unlike chaos.yaml, the vitest runner (chaos/run-failover-chaos.test.ts) spawns
# its own api-delivery fixture upstream(s) — one upstream behind the
# primary+secondary proxies for failover, two upstreams at divergent
# Meta.generations for ordering — so this job only boots toxiproxy and builds
# the api-delivery binary via scripts/run-failover-chaos.sh. Wall clock ~3 min.
#
# Scenarios gated here: f01-f05 (failover) + o02-o04 (ordering). o01-secondary-
# newer is SKIPPED — it asserts cross-leg "max-wins" (hold the higher generation
# even when the older primary leg is healthy), out of the §5f reject-older scope
# ("no source ranking") and not yet implemented. That behaviour is owned by
# qfg-7h5d.1.14; drop the CHAOS_SKIP below to re-gate o01 once it lands.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    # Nightly run on main (WS3.2, qfg-41nh.14): post-1.1.0 this suite is
    # otherwise dormant between SDK pushes while api-delivery keeps moving.
    # Cron times are staggered across the six backend SDK repos (06:10-07:25
    # UTC, 15 min apart) to be kind to shared runners and the toxiproxy image
    # pulls. Scheduled runs use repo-level secrets (QUONFIG_REPO_TOKEN is
    # repo-scoped), so the api-delivery checkout works here too. Failure
    # visibility relies on GitHub's default watcher-notification emails —
    # there is no Slack webhook wired into these repos yet.
    - cron: "25 6 * * *"

jobs:
  failover-chaos:
    name: Failover + Ordering Chaos
    # The "Checkout api-delivery" step needs secrets.QUONFIG_REPO_TOKEN to read
    # the private api-delivery repo. Dependabot PRs don't get Actions secrets, so
    # skip the job for them — it's a release gate that still runs on every push
    # to main after merge, and Test gates the PR meanwhile.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Suite is ~3 min; cap at 30 to absorb warmup + docker pull. Scenarios fail
    # fast inside the runner via their own wall_clock_seconds, so this only kicks
    # in if something hangs.
    timeout-minutes: 30
    steps:
      - name: Checkout sdk-node
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: sdk-node

      - name: Checkout integration-test-data
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: quonfig/integration-test-data
          path: integration-test-data
          # Must equal the pin in test.yaml and chaos.yaml: test.yaml runs
          # scripts/check-itd-refs.sh, which fails when they differ
          # (qfg-6vno.7). The corpus carries the hedge ordering scenarios:
          # o01 (fast primary wins, secondary never contacted), o03 (heal
          # forward), and o05 (slow older primary loses to a fast newer
          # secondary). (qfg-7h5d.1.14)
          ref: 7805088ae301eccfe1fbeaea79605aeb6cd3e21a # integration-test-data PR #19 head (qfg-zvyy.4); move to the tag cut from it before merging

      - name: Checkout api-delivery
        # api-delivery is private; the default GITHUB_TOKEN cannot read it. A PAT
        # with read access to quonfig/api-delivery must be configured as the repo
        # secret QUONFIG_REPO_TOKEN. The rigs build api-delivery from source
        # (GOWORK=off) to spawn their fixture upstreams.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: quonfig/api-delivery
          path: api-delivery
          ref: main
          token: ${{ secrets.QUONFIG_REPO_TOKEN }}

      - name: Record api-delivery SHA
        # api-delivery tracks main on purpose so chaos catches api-delivery
        # drift (kept by decision, qfg-goi1.1.2; see qfg-41nh.14).
        # Record exactly which commit this run exercised.
        run: |
          sha="$(git -C api-delivery rev-parse HEAD)"
          echo "api-delivery @ main: $sha"
          echo "api-delivery @ main: \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: api-delivery/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: sdk-node/package-lock.json

      - name: Install sdk-node deps
        working-directory: sdk-node
        run: npm ci

      - name: Verify docker compose available
        run: docker compose version

      - name: Run failover + ordering chaos rigs
        working-directory: sdk-node
        # The parallel-failover hedge (qfg-7h5d.1.14) makes o01 (fast primary
        # wins / cold standby), o03 (heal forward), and o05 (slow older primary
        # loses) all green, so nothing is skipped — clear CHAOS_SKIP. The wrapper
        # also clears its own default.
        env:
          CHAOS_SKIP: ""
        run: ./scripts/run-failover-chaos.sh

      - name: Upload chaos logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failover-chaos-logs-${{ github.run_id }}
          path: |
            sdk-node/.chaos-api-delivery
            sdk-node/chaos-*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Post failure to Slack
        # The nightly scheduled run posts to #incoming-webhook (org secret
        # SLACK_CI_WEBHOOK) only when it is not green; a hand-dispatched run
        # always posts. PR, push and workflow_call runs never post.
        if:
          always() && github.workflow == 'Failover Chaos' && ((github.event_name == 'schedule' &&
          job.status != 'success') || github.event_name == 'workflow_dispatch')
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_CI_WEBHOOK }}
          STATUS: ${{ job.status }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUITE: failover + ordering chaos
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "::error::SLACK_CI_WEBHOOK is not available to this run"
            exit 1
          fi
          case "$STATUS" in
            success) icon=":white_check_mark:" ;;
            cancelled) icon=":heavy_minus_sign:" ;;
            *) icon=":rotating_light:" ;;
          esac
          text="${icon} *${GITHUB_REPOSITORY}* ${SUITE} (${GITHUB_EVENT_NAME}): *${STATUS}* <${RUN_URL}|view run>"
          jq -n --arg text "$text" '{text: $text}' |
            curl -sSf -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK"
